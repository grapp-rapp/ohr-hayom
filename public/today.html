<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ohr HaYom · אור היום</title>
  <meta name="description" content="A daily bilingual Dvar Torah on the weekly parsha for Bar and Bat Mitzvah–age kids.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Hebrew:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-lang="both">
  <header class="hero">
    <a href="/today" class="logo"><img src="logo.png" alt="Torah B'Ahava"></a>
    <h1 class="app-name">
      <span class="he" lang="he">אור היום</span>
      <span class="en-sub">Ohr HaYom · The Light of Torah for Every Day</span>
    </h1>
    <nav class="site-nav">
      <a href="/today" aria-current="page">Today</a>
      <a href="/archive">Archive</a>
    </nav>

    <p class="week-line" id="week-line" hidden></p>

    <div class="controls">
      <div class="row">
        <label class="select-wrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>          <select id="parsha-select" aria-label="Parsha" disabled><option>Loading…</option></select>
        </label>
      </div>
      <div class="row">
        <div class="segmented" id="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="both">Both</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="he" lang="he">עברית</button>
        </div>
        <button type="button" class="btn" id="fresh-btn" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          New Teaching
        </button>
        <button type="button" class="btn" id="print-btn" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
          Print
        </button>
        <button type="button" class="btn" id="share-btn" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4"/><path d="M15.4 6.5l-6.8 4"/></svg>
          Share
        </button>
      </div>
    </div>

    <p class="notice" id="week-note" hidden></p>
  </header>

  <main>
    <div id="content" aria-live="polite"></div>
  </main>

  <footer class="site-footer no-print">
    Weekly readings follow the diaspora schedule.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
