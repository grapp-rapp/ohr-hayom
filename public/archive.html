<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive · Ohr HaYom</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Hebrew:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-lang="both">
  <header class="hero">
    <a href="/" class="logo"><img src="logo.png" alt="Torah B'Ahava"></a>
    <h1 class="app-name">
      <span class="he" lang="he">ארכיון</span>
      <span class="en-sub">Archive · Every teaching so far</span>
    </h1>
    <nav class="site-nav">
      <a href="/">Today</a>
      <a href="/archive" aria-current="page">Archive</a>
    </nav>

    <div class="controls">
      <div class="row" style="width:100%">
        <input type="search" id="search" aria-label="Search" placeholder="Search parsha, verse, story… · חיפוש" autocomplete="off">
      </div>
      <div class="row">
        <div class="segmented" id="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="both">Both</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="he" lang="he">עברית</button>
        </div>
      </div>
    </div>
    <div class="ornament" aria-hidden="true">✦</div>
  </header>

  <main style="padding-top:0">
    <p class="archive-count" id="count" aria-live="polite"></p>
    <div id="list"></div>
  </main>

  <script type="module" src="archive.js"></script>
</body>
</html>
